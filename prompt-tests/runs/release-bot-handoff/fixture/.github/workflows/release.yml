name: release

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/tag.sh
      - run: cargo build --release && cargo test --release && ./scripts/collect.sh

  publish:
    needs: build
    runs-on: release
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/push.sh "$(git describe --tags --abbrev=0)"
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
