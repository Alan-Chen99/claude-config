[project]
name = "claude-config"
version = "0.1.0"
description = "Claude Code configuration: skills, agents, and conventions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cappa>=0.31.0",
  "mitmproxy>=12.0",
  "pip>=26.0.1",
  "pydantic>=2.12.5",
  "pytest>=9.0.2",
  "hypothesis>=6.148.7",
  "anthropic>=0.49.0",
  "httpx>=0.28.1",
  "tokenizers>=0.22.1",
  "python-dotenv>=1.0.0",
  "pygit2>=1.19.2",
  "basedpyright>=1.39.5",
  "matplotlib>=3.10",
]

[project.scripts]
cc-cost = "claude_config.cc_cost.main:main"
cc-pretty = "claude_config.cc_pretty.main:main"
cc-pretty-intercept = "claude_config.cc_pretty_intercept.main:main"
cc-replay = "claude_config.cc_replay.main:main"
cc-render-coverage = "claude_config.cc_pretty.coverage:main"
cc-workflow-extract = "claude_config.cc_workflow.extract:main"
doc-budget = "claude_config.doc_budget:main"
opencode-pretty = "claude_config.opencode_pretty.main:main"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["src", "skills/scripts"]
testpaths = ["tests", "skills/scripts/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_config"]
