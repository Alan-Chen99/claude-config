# Doc budget: token caps for every tracked `.md`, grouped by how the text
# reaches a context.  Design: docs/superpowers/specs/2026-09-29-doc-budget-design.md
# Policy: conventions/documentation.md, "Documentation budget".
# Measure: uv run doc-budget [--print-held] [path ...]
#
# Unit: local-tokenizer tokens (`agent-tools count-tokens` without `--api`),
# the backend that runs offline, in CI and in worktrees.  Claude context is
# about 1.5x this on prose; the backends never reconcile.
#
# A file's group, first match wins: a group named with its path ([held.files]
# included); a [data] path covering it -- listed, never counted, except that a
# README.md or CLAUDE.md counts wherever it is; its derived class; the longest
# path group, a literal name over a placeholder on a tie; the residual.
# `one_of` claims its files ahead of all of this and pays the largest member.
# `per_file` makes each file its own group at the group's cap; `<name>` stands
# for one path segment and makes each match its own group.  `cap` falls back
# to `default_cap`.
# `loaded` is the report's section header; a group nested under a `per_file`
# or `<name>` group shows under its parent's label, so it needs none.
# Hook stdout is not `.md` and is pinned beside its renderer under the same
# rule: the env-context block (tests/test_env_context.py), the
# pre_output.record reminder (tests/test_pre_output_record.py) and the
# SubagentStart ask (agent-tools/src/hook_subagent.rs).
#
# Over cap, cut that group to `cut_to` of cap (80% today) in the same change.
# A cap at or just above today's size is deliberate: the first addition to such
# a group pays the cut, and raising a cap is the user's call, not the cutting
# agent's.  Loosening -- a [data] entry, the [held] table, a cap above the one
# the group would otherwise have -- carries `approved`: `<8 hex of session id>`
# is an agent's own session and inert there; `user:<8 hex>` is the session in
# which the user approved it and live at once; either opens with
# `agent-tools cc-pretty <8 hex> --skeleton`.  Class caps and `default_cap` are
# policy the user edits.
# `# target N` on a group the resolver cannot hold (a named file, a one_of set,
# a directory) is the cap its next cut lowers it to: the cut lands at 80% of N
# and deletes the line.  Decisions: plans/2026-09-30-doc-budget-reduction.md.

cut_to = 0.8
default_cap = 12000

# -- every request ----------------------------------------------------------

[groups."sys_prompt/alan-default-next.md"]
loaded = "every request, every project"
cap = 4400

# One opencode agent body is loaded per session; the set pays its largest.
# target 4,400: the cc prompt's cap, for the same job.
[groups.opencode-prompt]
loaded = "every request of an opencode session"
one_of = "opencode/agents/<agent>.md"
cap = 5200

# -- every session ----------------------------------------------------------

# The `description:` of every skill and agent, which the skills listing carries
# into every session; counted here and again inside its file.
# target 900: a trigger needs the when; six descriptions run 74-116 tokens and
# carry the how.
[groups.descriptions]
loaded = "every session, every project"
derived = "descriptions"
cap = 1200

# -- per invocation, per spawn ----------------------------------------------

# skills/<n>/SKILL.md and .claude/skills/<n>/SKILL.md, each its own group.  The
# body is the workflow (long-bash does its job in 1,051); what it refers to
# lives under skills/<name>, loaded on demand.
[groups.skill-bodies]
loaded = "per invocation"
derived = "skill-bodies"
cap = 2000

# Grew to 7,316 before anything measured it, so it carries a cap of its own;
# 1,000 stands until the skill's job changes.
[groups."skills/telegram-hitl/SKILL.md"]
cap = 1000

# agents/*.md, each its own group; a spawn is an invocation, so the skill-body
# cap.  The three held bodies share one precedence table and one
# Missing-documentation block verbatim.
[groups.agent-bodies]
loaded = "per spawn"
derived = "agent-bodies"
cap = 2000

# Agent bodies tell their agent to read these, so the set is spent per spawn;
# the cap sits just above today's size and the next growth past it pays the cut.
# target 20,000: code-quality/README.md beside code-quality/CLAUDE.md is two
# indexes; 04, 07 and 08 overlap; documentation.md is half examples.
[groups.conventions]
loaded = "per spawn (agent bodies read them)"
cap = 25000
approved = "user:834203fa"

# -- every session touching the directory -----------------------------------

# Every CLAUDE.md, each its own group.
[groups.claude-md]
loaded = "every session touching the directory"
derived = "claude-md"
cap = 1500

# -- on demand, one file at a time ------------------------------------------

# docs, notes and specs: 2,000 for a new file, read whole when read at all.
# Nothing is raised above it: an over-size file holds below, and a raise is
# asked for at cut time with what the 80% target would lose -- the three
# most-read docs are each pointed at for one section and Read whole, so size
# there is what the reader pays, not what it needs.
[groups.docs]
loaded = "on demand, one file at a time"
per_file = true
cap = 2000

[groups.notes]
loaded = "on demand, one file at a time"
per_file = true
cap = 2000

[groups."docs/superpowers/specs"]
per_file = true
cap = 2000

# The capture subproject's two oversized docs, cut on 2026-10-02 from 15,516 and
# 8,432 and capped at what the cut reached, so the next addition to either pays
# the 20%.  README.md is the procedure for 10 variants, 5 model ids and 3
# credentials, plus the traps a re-capture hits; what-the-model-gets.md is the
# per-model walkthrough and the only place the per-tool character table lives.
# What came out was the 2.1.269 release analysis, moved whole to eight
# notes/cc-2.1.269-*.md records rather than deleted -- it is cited measurement,
# and the class cap of 2,000 would have meant deleting it.
[groups."docs/system-prompt-snapshot/README.md"]
cap = 7300
approved = "user:4d6ec7ec"

[groups."docs/system-prompt-snapshot/what-the-model-gets.md"]
cap = 7882
approved = "user:4d6ec7ec"

# Ad-hoc working plans, read one at a time and each its own size, so each file
# is its own group at 1,000; the writing-plans records
# under docs/superpowers/plans are data below, not plans in this sense.
[groups.plans]
loaded = "on demand, one file at a time"
per_file = true
cap = 1000

# -- on demand, a skill's own docs ------------------------------------------

# Each skill's own docs, references and resources; its SKILL.md is a skill
# body and its CLAUDE.md a claude-md.
[groups."skills/<name>"]
loaded = "on demand, when the skill is invoked"

# The repo-local skills under .claude/skills, the same class.
[groups.".claude/skills/<name>"]
loaded = "on demand, when the skill is invoked"

# One reference per topic, read one at a time.
[groups."skills/prompt-engineer/references"]
per_file = true
cap = 8000

# INTENT.md is the skill's 11k design spec, read whole; the cap is today's size,
# so the next addition pays the 20% cut.
# target 12,000 (default_cap): INTENT.md is a spec, and a spec is 2,000 elsewhere.
[groups."skills/planner"]
cap = 17808
approved = "user:834203fa"

# -- on demand, a directory at a time ---------------------------------------

[groups.scripts]
loaded = "on demand"

[groups.prompt-tests]
loaded = "on demand"

[groups.sys_prompt]
loaded = "on demand"

# settings.json has had `outputStyle: default` since cbeb6721, so nothing here
# is loaded; the cap keeps the directory from growing unnoticed.
# target 7,000: alan-default.md is the superseded twin of alan-default-next.md;
# the README's Reference half is snapshot material.
[groups.output-styles]
loaded = "not loaded since cbeb6721 (outputStyle: default)"
cap = 11000

# Everything else: root README.md and skills/README.md.  Residual, so a new
# directory lands here and shows as infra debt, not nowhere.
# target 9,000: skills/README.md is the scripts' layout convention, mostly
# template; the public README stays.
[groups.infra]
loaded = "on demand, the residual"
residual = true
cap = 12000

