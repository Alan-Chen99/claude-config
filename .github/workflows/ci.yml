name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This action stopped publishing floating major tags after v7; its README
      # pins by commit. The exact tag is the closest equivalent.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: Run the Python suite
        run: uv run pytest -q

  prompt-rationale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Needs only python3 and the two files it reads, so it runs on the bare
      # image: a section of sys_prompt/CLAUDE.md that names no live prompt text
      # is what fails, and the fix is to delete it.
      - name: Every rationale section names live prompt text
        run: ./scripts/check-prompt-rationale.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-tools
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
      # `agent-tools count-tokens` execs `uv run` against the venv at
      # ~/.claude/venvs/<repo basename>; its tests fail loudly without one.
      - name: Provision the venv agent-tools execs
        working-directory: .
        run: UV_PROJECT_ENVIRONMENT="$HOME/.claude/venvs/$(basename "$PWD")" uv sync --frozen
      - name: Run the Rust suite
        run: cargo test
